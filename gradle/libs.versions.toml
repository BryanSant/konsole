[versions]
kotlin = "2.3.21"
coroutines = "1.10.2"
kotlinx-io = "0.9.0"
kotest = "6.1.11"
commonmark = "0.24.0"
treesitter = "0.25.3"

[libraries]
kotlin-reflect          = { module = "org.jetbrains.kotlin:kotlin-reflect",            version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-io-core         = { module = "org.jetbrains.kotlinx:kotlinx-io-core",         version.ref = "kotlinx-io" }
commonmark              = { module = "org.commonmark:commonmark",                     version.ref = "commonmark" }
commonmark-gfm-tables   = { module = "org.commonmark:commonmark-ext-gfm-tables",      version.ref = "commonmark" }
treesitter              = { module = "io.github.bonede:tree-sitter",                  version.ref = "treesitter" }
treesitter-kotlin       = { module = "io.github.bonede:tree-sitter-kotlin",           version = "0.3.8.1" }
treesitter-java         = { module = "io.github.bonede:tree-sitter-java",             version = "0.23.4" }
treesitter-python       = { module = "io.github.bonede:tree-sitter-python",           version = "0.23.4" }
treesitter-json         = { module = "io.github.bonede:tree-sitter-json",             version = "0.24.8" }
treesitter-bash         = { module = "io.github.bonede:tree-sitter-bash",             version = "0.25.1" }
treesitter-markdown     = { module = "io.github.bonede:tree-sitter-markdown",         version = "0.7.1" }
treesitter-javascript   = { module = "io.github.bonede:tree-sitter-javascript",       version = "0.25.0" }
treesitter-typescript   = { module = "io.github.bonede:tree-sitter-typescript",       version = "0.23.2" }
treesitter-rust         = { module = "io.github.bonede:tree-sitter-rust",             version = "0.24.0" }
treesitter-go           = { module = "io.github.bonede:tree-sitter-go",               version = "0.25.0" }
treesitter-yaml         = { module = "io.github.bonede:tree-sitter-yaml",             version = "0.5.0a" }
treesitter-toml         = { module = "io.github.bonede:tree-sitter-toml",             version = "0.5.1a" }
kotest-runner-junit5    = { module = "io.kotest:kotest-runner-junit5",                version.ref = "kotest" }
kotest-property         = { module = "io.kotest:kotest-property",                     version.ref = "kotest" }
kotest-assertions-core  = { module = "io.kotest:kotest-assertions-core",              version.ref = "kotest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
